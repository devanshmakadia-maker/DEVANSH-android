name: Build DEVANSH APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find the actual project folder
        id: findproj
        run: |
          PROJECT_DIR=$(dirname "$(find . -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -n 1)")
          echo "Found project at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Generate Gradle wrapper
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: chmod +x gradlew

      - name: Build debug APK (self-signed automatically, no secrets needed)
        working-directory: ${{ steps.findproj.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEVANSH-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
